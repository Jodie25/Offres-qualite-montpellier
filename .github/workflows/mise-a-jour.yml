name: Mise à jour des offres

on:
  schedule:
    # GitHub retarde souvent les tâches planifiées de plusieurs heures : on tente donc plusieurs fois par jour,
    # et le robot ne collecte que si la dernière collecte a plus de 20 heures (voir --si-ancien).
    - cron: "17 3,5,7,9,11,13,15,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "collecte/config.json", "collecte/collecter.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: offres
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter les offres
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python collecte/collecter.py --si-ancien 20
          else
            python collecte/collecter.py
          fi
      - name: Enregistrer les données
        run: |
          git config user.name "robot-offres"
          git config user.email "robot-offres@users.noreply.github.com"
          git add data/offres.json data/geo.json
          git diff --staged --quiet || git commit -m "Offres du $(date +%F)"
          git pull --rebase -X theirs
          git push

  publier:
    needs: [collecte]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r data _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
